plugins {
    id 'com.android.application'
}
repositories {
    maven { url 'https://api.xposed.info/' }
    google()
    mavenCentral()
}
android {
    namespace 'com.ws.dyfire'
    compileSdk 34
    defaultConfig {
        applicationId "com.ws.dyfire"
        minSdk 27
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
